# Builds the Arch Linux x86-64 binary and publishes a GitHub release.
#
# Start it by pushing a tag (`git tag v0.2.0 && git push origin v0.2.0`) or
# from the Actions tab ("Run workflow", enter the version). The version must
# match Cargo.toml, and CHANGELOG.md must have a section for it. After the
# release is published, aur-publish.yml updates the AUR packages.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (must match Cargo.toml)"
        required: true

permissions:
  contents: write

jobs:
  build-arch:
    name: Build (Arch Linux x86-64)
    runs-on: ubuntu-latest
    # build on Arch itself, so the binary links against Arch's current glibc
    container: archlinux:latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git rust

      - uses: actions/checkout@v4

      - name: Check version
        id: version
        env:
          REQUESTED: ${{ inputs.version || github.ref_name }}
        run: |
          want="${REQUESTED#v}"
          have=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "$want" != "$have" ]; then
            echo "::error::Releasing $want but Cargo.toml says $have"
            exit 1
          fi
          if ! grep -q "^## \[$want\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $want"
            exit 1
          fi
          echo "version=$want" >> "$GITHUB_OUTPUT"

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bin=target/release/snip
          ./"$bin" --db /tmp/smoke.db add "release smoke test" --tag ci
          ./"$bin" --db /tmp/smoke.db search smoke | grep -q "release smoke test"

          mkdir -p dist
          tar -czf dist/snip-arch-linux-x86_64.tar.gz -C target/release snip
          (cd dist && sha256sum snip-arch-linux-x86_64.tar.gz > SHA256SUMS)

          glibc=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n1)
          size=$(stat -c %s "$bin")
          archive=$(stat -c %s dist/snip-arch-linux-x86_64.tar.gz)
          {
            awk -v v="$VERSION" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md
            echo "## Install (Arch Linux x86-64)"
            echo
            echo '```bash'
            echo "curl -fLO https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/snip-arch-linux-x86_64.tar.gz"
            echo "curl -fLO https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/SHA256SUMS"
            echo 'sha256sum -c SHA256SUMS && tar -xzf snip-arch-linux-x86_64.tar.gz && install -Dm755 snip "$HOME/.local/bin/snip"'
            echo '```'
            echo
            mb() { awk -v b="$1" 'BEGIN { printf "%.2f MB", b / 1048576 }'; }
            echo "- Executable: $(mb "$size"); download archive: $(mb "$archive")."
            echo "- Needs glibc $glibc or newer and gcc-libs. SQLite is bundled; no Rust needed."
            echo "- Built on archlinux:latest from commit ${GITHUB_SHA}. Not an ARM build."
            echo "- Or build from source on any platform: \`cargo install snip-notes\`."
          } > dist/notes.md
          cat dist/notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    name: Publish release
    needs: build-arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-arch.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Snip v${{ needs.build-arch.outputs.version }} — Arch Linux x86-64
          body_path: dist/notes.md
          files: |
            dist/snip-arch-linux-x86_64.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true

  aur:
    name: Update AUR packages
    needs: [build-arch, release]
    uses: ./.github/workflows/aur-publish.yml
    with:
      version: ${{ needs.build-arch.outputs.version }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
